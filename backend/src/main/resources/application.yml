spring:
  application:
    name: redae-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}
  cookie:
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

resend:
  enabled: ${EMAIL_VERIFICATION_ENABLED:false}
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:}

ai:
  gemini:
    api-key: ${GOOGLE_API_KEY:}
    model: ${AI_MODEL:gemini-3.6-flash}

evaluation:
  require-credit-for-complete: ${EVALUATION_REQUIRE_CREDIT_FOR_COMPLETE:false}
