name: Backend CI

on:
  push:
    paths: ['backend/**']
  pull_request:
    paths: ['backend/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode test
      - run: mvn --batch-mode spotless:check
      - run: mvn --batch-mode verify -DskipTests
      - run: mvn --batch-mode org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 -DskipTests
