name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode test
      - run: mvn --batch-mode spotless:check
      - run: mvn --batch-mode verify -DskipTests
      - name: OWASP dependency check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "NVD_API_KEY is not configured in GitHub repository secrets."
            exit 1
          fi
          mvn --batch-mode org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 -DskipTests -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
