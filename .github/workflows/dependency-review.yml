name: Dependency Review

on:
  pull_request:
    paths:
      - 'frontend/package-lock.json'
      - 'frontend/package.json'
      - 'backend/pom.xml'

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
